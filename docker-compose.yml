version: '3.8'

volumes:
  postgres_data:
    name: driving_school_postgres_data
  pgadmin_data:
    name: driving_school_pgadmin_data

services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

  api:
    build: .
    environment:
      # Database settings
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=driving_school_db
      - DB_PORT=5432
      
      # Business hours
      - BUSINESS_HOURS_START=8
      - BUSINESS_HOURS_END=17
      
      # Pagination settings
      - DEFAULT_PAGE_SIZE=20
      - MAX_PAGE_SIZE=100
      
      # Time slot settings
      - TIME_SLOT_INTERVAL=30
      - MIN_LESSON_DURATION=30
      - MAX_LESSON_DURATION=180
      
      # Validation patterns
      - PHONE_NUMBER_PATTERN=^\+?1?\d{9,15}$
      - DATE_FORMAT_PATTERN=^\d{4}-\d{2}-\d{2}$
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped
